name: Serafin

options:
  bundleIdPrefix: app.getserafin
  deploymentTarget:
    iOS: "26.1"
  developmentLanguage: en
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The owner's Apple Developer team, for signing on devices and for App Store Connect.
    DEVELOPMENT_TEAM: GZW73G7ZF7
    CODE_SIGN_STYLE: Automatic

packages:
  SerafinKit:
    path: Packages/SerafinKit

targets:
  Serafin:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SerafinKit
        products:
          - SerafinFeatures
          - SerafinDesign
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Serafin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Serafin uses Face ID to unlock when you turn on its lock in Settings.
        NSLocalNetworkUsageDescription: Serafin looks for Jellyfin servers on your network.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        # iPhone is portrait only; the player screen (plan task 1.7) rotates to landscape on its own.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getserafin.serafin
        # The layered Icon Composer icon in App/AppIcon.icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # The shortcuts' titles go into Localizable.xcstrings, as SerafinKit's strings do.
        SWIFT_EMIT_LOC_STRINGS: YES

  SerafinAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Serafin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getserafin.serafin.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Serafin.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Serafin
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Serafin:
    build:
      targets:
        Serafin: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SerafinAppTests
        - package: SerafinKit/SerafinCoreTests
        - package: SerafinKit/SerafinPlaybackTests
        - package: SerafinKit/SerafinDesignTests
        - package: SerafinKit/SerafinFeaturesTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
